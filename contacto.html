    <header>

        <nav>

                <li><a href="receta2.html">Risotto de setas</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

    <section class="contacto">

        <h2>Contacto</h2>

        <p>
            Si quieres compartir una receta o hacer una sugerencia,
            puedes enviarme un mensaje.
        </p>

        <form id="formularioContacto">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre"
                required>

            <input
                type="email"
                id="email"
                placeholder="Correo electrónico"
                required>

            <textarea
                id="mensaje"
                placeholder="Escribe tu mensaje"
                rows="6"
                required></textarea>

            <button type="submit">
                Enviar mensaje
            </button>

        </form>

        <p id="respuesta"></p>

    </section>

    <footer>
        <p>© 2026 Carolina Montes Pérez | Sabores Caseros</p>
    </footer>

    <script src="js/script.js"></script>

</body>
